<style>
:root{
  --bg:#FBF8F2; --bg2:#F5EFE4; --card:#FFFFFF; --line:#EAE3D8; --line2:#F1EBE0;
  --ink:#2A2622; --ink2:#7C736A; --ink3:#A79C90;
  --brown:#A9714B; --brown2:#8C5A38; --gold:#D9A404; --green:#2F7A5A; --blue:#2B6CB0;
  --red:#B4453C; --purple:#6B5B95;
  --r:16px; --shadow:0 1px 2px rgba(42,38,34,.04), 0 8px 24px rgba(42,38,34,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:780px;margin:0 auto;padding:0 0 104px}

/* ── header ── */
.top{position:sticky;top:0;z-index:30;background:rgba(251,248,242,.92);backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);padding:12px 18px 10px}
.top .eyebrow{font-size:11px;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.top .ttl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.top h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em}
.top .count{font-size:11.5px;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);
  padding:5px 9px;border-radius:999px;white-space:nowrap}

/* ── nav ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink3);font-size:10.5px;font-weight:600;cursor:pointer;border-radius:12px}
.nav button .ic{font-size:18px;line-height:1}
.nav button.on{color:var(--ink)}
.nav button.on .ic{transform:translateY(-1px)}

/* ── layout bits ── */
main{padding:16px 16px 8px}
.sec{margin:22px 0 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.sec-h h2{font-size:14px;font-weight:800;margin:0;letter-spacing:-.01em}
.sec-h .sub{font-size:11.5px;color:var(--ink3)}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease, border-color .12s ease}
.card:active{transform:scale(.995)}
.card .ct{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.card .nm{font-size:14.5px;font-weight:700;letter-spacing:-.015em;line-height:1.35}
.card .meta{margin-top:6px;font-size:12px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.card .note{margin-top:6px;font-size:11.5px;color:var(--ink3)}
.plat{font-size:10.5px;font-weight:700;color:var(--brown2);background:#F7EFE6;border:1px solid #EFE2D3;
  padding:3px 7px;border-radius:7px;white-space:nowrap}
.st{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:7px;border:1px solid transparent;white-space:nowrap}
.st-applied{color:#8A6A00;background:#FDF6E0;border-color:#F2E3B8}
.st-won{color:var(--green);background:#EAF5EF;border-color:#D3E9DE}
.st-writing{color:var(--blue);background:#EAF1FA;border-color:#D5E3F4}
.st-submitted{color:#0F766E;background:#E7F5F3;border-color:#CFE9E5}
.st-done{color:#59524B;background:#F1EDE7;border-color:#E4DDD3}
.st-lost{color:#9A8E82;background:#F6F3EE;border-color:#EBE5DC}
.st-hold{color:#8A6A00;background:#FBF3E3;border-color:#EFE1C6}
.dday{font-size:11px;font-weight:800;color:var(--ink2);margin-left:auto;white-space:nowrap}
.dday.soon{color:#B45309}
.dday.now{color:#fff;background:var(--red);padding:2px 6px;border-radius:6px}
.dday.over{color:var(--red)}
.fee{font-size:11px;color:var(--red);margin-top:5px}
.prog{height:5px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;background:var(--brown);border-radius:99px}

/* ── stats ── */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;color:var(--ink3);font-weight:600}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.stat .v small{font-size:11.5px;font-weight:700;color:var(--ink2);margin-left:2px}
.stat .d{font-size:10.5px;color:var(--ink3);margin-top:2px}
.stat.acc .v{color:var(--brown2)}

/* ── chips / toolbar ── */
.toolbar{display:flex;flex-direction:column;gap:9px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;background:none;flex:1;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:1px 0 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.selrow{display:flex;gap:8px}
.selrow select{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:600}

/* ── buttons ── */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;
  font-size:13.5px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.brown{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.danger{color:var(--red);border-color:#EEDCDA;background:#FDF6F5}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.fab{position:fixed;right:16px;bottom:86px;z-index:35;width:54px;height:54px;border-radius:50%;
  border:0;background:var(--ink);color:#fff;font-size:26px;line-height:1;box-shadow:0 10px 24px rgba(42,38,34,.28);cursor:pointer}

/* ── sheet / modal ── */
.scrim{position:fixed;inset:0;background:rgba(30,26,22,.42);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;
  background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -8px 40px rgba(42,38,34,.2);
  transform:translateY(102%);transition:transform .22s ease;padding:0 0 calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.sheet .sh-top{position:sticky;top:0;background:var(--bg);padding:14px 18px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px}
.sheet .sh-top h3{margin:0;font-size:15.5px;font-weight:800;flex:1}
.sheet .body{padding:14px 18px 4px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:10px 11px;font-size:14px;outline:none}
.fld textarea{min-height:72px;resize:vertical}
.fld.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld.two > div{min-width:0}
.fld.two label{display:block}
.hint{font-size:11px;color:var(--ink3);margin-top:4px}
.tline{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line2)}
.tline:last-child{border-bottom:0}
.tline input[type=checkbox]{width:18px;height:18px;accent-color:var(--brown)}
.tline span{flex:1;font-size:13px}
.tline.done span{color:var(--ink3);text-decoration:line-through}
.tline .x{border:0;background:none;color:var(--ink3);font-size:15px;cursor:pointer;padding:2px 4px}
.tadd{display:flex;gap:6px;margin-top:8px}
.tadd input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px}
.sheet .foot{display:flex;gap:8px;padding:12px 18px 4px}
.sheet .foot .btn{flex:1}

/* ── calendar ── */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 12px 8px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:14.5px}
.cal-h button{border:0;background:var(--bg2);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-dow span{text-align:center;font-size:10.5px;color:var(--ink3);font-weight:700;padding:2px 0}
.cal-dow span.sun{color:#C0605A}
.day{position:relative;aspect-ratio:1/1.06;border:0;background:none;border-radius:10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px}
.day.blank{visibility:hidden}
.day .n{font-weight:600}
.day.today{background:var(--bg2);box-shadow:inset 0 0 0 1.5px var(--brown)}
.day.sel{background:var(--ink);color:#fff}
.day.sel .dot{background:#fff !important}
.dots{display:flex;gap:2px;height:4px}
.dot{width:4px;height:4px;border-radius:50%}
.dot.a{background:var(--gold)} .dot.e{background:var(--red)} .dot.v{background:var(--purple)}
.day.sun .n{color:#C0605A}
.daylist{margin-top:10px;display:grid;gap:8px}

/* ── settle ── */
.money{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;box-shadow:var(--shadow)}
.mrow .nm{flex:1;font-size:13px;font-weight:600;min-width:0}
.mrow .nm small{display:block;color:var(--ink3);font-weight:500;font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .amt{font-size:13.5px;font-weight:800;white-space:nowrap}
.mrow .amt.plus{color:var(--green)} .mrow .amt.minus{color:var(--red)}
.mrow .pay{border:1px solid var(--line);background:var(--bg2);border-radius:9px;font-size:11px;font-weight:700;padding:6px 9px;cursor:pointer}
.mrow .pay.on{background:var(--green);border-color:var(--green);color:#fff}

/* ── misc ── */
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:26px 10px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,14px);background:rgba(42,38,34,.94);color:#fff;
  font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:.2s;z-index:80}
.toast.on{opacity:1;transform:translate(-50%,0)}
details.help{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:10px}
details.help summary{font-size:12.5px;font-weight:700;cursor:pointer}
details.help p{font-size:12px;color:var(--ink2);margin:8px 0 0;line-height:1.6}
@media(min-width:760px){
  .grid{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(4,1fr)}
  .money{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:900px){
  .app{padding-bottom:24px}
  .nav{position:static;bottom:auto;border-top:0;border-bottom:1px solid var(--line);
    background:rgba(251,248,242,.92);padding:8px 16px;gap:8px;backdrop-filter:blur(10px)}
  .nav button{flex:0 0 auto;flex-direction:row;gap:6px;font-size:12.5px;padding:8px 14px}
  .nav button .ic{font-size:15px}
  .nav button.on{background:var(--ink);color:#fff}
  .fab{bottom:28px;right:calc((100vw - 780px)/2 + 16px)}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-46%);width:560px;border-radius:20px;
    max-height:88vh;opacity:0;transition:opacity .16s ease, transform .16s ease}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .toast{bottom:32px}
}

/* ───────── dates ───────── */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => ymd(new Date());
function parseD(s){ if(!s) return null; const p = s.slice(0,10).split('-').map(Number);
  if(p.length<3 || !p[0]) return null; return new Date(p[0], p[1]-1, p[2]); }
function diffDays(s){ const d = parseD(s); if(!d) return null;
  return Math.round((d - parseD(todayStr()))/86400000); }
function md(s){ const d = parseD(s); return d ? (d.getMonth()+1)+'/'+d.getDate() : ''; }
function mdw(s){ const d = parseD(s); if(!d) return '';
  return md(s)+'('+'일월화수목금토'[d.getDay()]+')'; }
function clock(s){ return s && s.length>10 ? s.slice(11,16) : ''; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function ddayLabel(s){
  const n = diffDays(s); if(n === null) return '';
  if(n === 0) return 'D-DAY'; if(n > 0) return 'D-'+n; return 'D+'+(-n);
}
function ddayClass(s){ const n = diffDays(s); if(n===null) return '';
  if(n <= 0) return n===0 ? 'now' : 'over';
  if(n <= 3) return 'soon'; return ''; }

let DB = loadDB();
const state = {view:'home', q:'', chip:'active', platform:'all', sort:'end',
  calMonth:startOfMonth(new Date()), calDay:todayStr(), editingId:null, buf:null};

/* ───────── storage ───────── */
function loadDB(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.campaigns)) return d; } }
  catch(e){ console.warn('load failed', e); }
  return JSON.parse(JSON.stringify(SEED));
}
function saveDB(){
  DB.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast('저장 공간이 부족해요'); }
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 1700);
}

/* ───────── selectors / stats ───────── */
const byId = id => DB.campaigns.find(c => c.id === id);
const activeOnes = () => DB.campaigns.filter(c => ACTIVE.includes(c.status));

function needsResult(){
  const t = todayStr();
  return DB.campaigns.filter(c => c.status==='applied' && c.announceAt && c.announceAt.slice(0,10) <= t);
}
function dueSoon(days){
  return activeOnes().filter(c => {
    if(c.status === 'applied') return false;
    const n = diffDays(c.endAt);
    return n !== null && n >= 0 && n <= days;
  }).sort((a,b)=> (a.endAt||'').localeCompare(b.endAt||''));
}
function overdue(){
  return activeOnes().filter(c => {
    if(c.status === 'applied') return false;
    const n = diffDays(c.endAt); return n !== null && n < 0;
  });
}
function todayEvents(){
  const t = todayStr();
  return DB.campaigns.filter(c => (c.visitAt||'').slice(0,10)===t);
}
function weekEvents(){
  return DB.campaigns.filter(c => {
    const t = todayStr();
    return ['announceAt','endAt','visitAt'].some(k => {
      const n = diffDays(c[k]); return n !== null && n >= 1 && n <= 7;
    }) && !['lost','done'].includes(c.status);
  });
}
function taskProgress(c){
  const t = c.tasks || []; if(!t.length) return null;
  return { done: t.filter(x=>x.done).length, total: t.length };
}
function moneySums(){
  let cashExpected = 0, pointExpected = 0, goods = 0, feeConfirmed = 0, feeExpected = 0;
  DB.campaigns.forEach(c => {
    const amt = (c.reward && c.reward.amount) || 0;
    if(!c.paid && !['lost','done'].includes(c.status)){
      if(c.reward && c.reward.kind === '현금') cashExpected += amt;
      if(c.reward && c.reward.kind === '포인트') pointExpected += amt;
    }
    if(['won','writing','submitted','done'].includes(c.status) && c.price) goods += c.price;
    if(['won','writing','submitted'].includes(c.status)) feeConfirmed += (c.fee||0);
    if(c.status === 'applied') feeExpected += (c.fee||0);
  });
  return {cashExpected, pointExpected, goods, feeConfirmed, feeExpected};
}
const won = n => (n||0).toLocaleString('ko-KR');

/* ───────── filtering ───────── */
function filtered(){
  let out = DB.campaigns.slice();
  if(state.chip === 'active') out = out.filter(c => ACTIVE.includes(c.status) || c.status==='hold');
  else if(state.chip !== 'all') out = out.filter(c => c.status === state.chip);
  if(state.platform !== 'all') out = out.filter(c => c.platform === state.platform);
  const q = state.q.trim().toLowerCase();
  if(q) out = out.filter(c => (c.name+' '+(c.brand||'')+' '+(c.note||'')).toLowerCase().includes(q));
  const key = state.sort;
  out.sort((a,b)=>{
    if(key==='end') return (a.endAt||'9999').localeCompare(b.endAt||'9999');
    if(key==='announce') return (a.announceAt||'9999').localeCompare(b.announceAt||'9999');
    if(key==='name') return a.name.localeCompare(b.name,'ko');
    return (b.appliedAt||'').localeCompare(a.appliedAt||'');
  });
  return out;
}

/* ───────── render: card ───────── */
function cardHTML(c){
  const p = taskProgress(c);
  let dateLine = '';
  if(c.status === 'applied'){
    dateLine = c.announceAt ? `발표 ${mdw(c.announceAt)}` : '발표일 미정';
    if(c.endAt) dateLine += ` · 리뷰 ~${md(c.endAt)}`;
  }else if(c.status === 'lost'){
    dateLine = c.announceAt ? `결과 ${md(c.announceAt)}` : '결과 확인';
  }else if(c.status === 'done'){
    dateLine = c.endAt ? `${md(c.endAt)} 완료` : '완료';
  }else{
    if(c.visitAt) dateLine = `방문 ${mdw(c.visitAt)} ${clock(c.visitAt)}`;
    else if(c.reviewStart) dateLine = `리뷰 ${md(c.reviewStart)}~${md(c.endAt)}`;
    else if(c.endAt) dateLine = `마감 ${mdw(c.endAt)}`;
  }
  const ddTarget = c.status==='applied' ? c.announceAt : (c.status==='done'||c.status==='lost' ? null : c.endAt);
  const dd = ddTarget ? `<span class="dday ${ddayClass(ddTarget)}">${ddayLabel(ddTarget)}</span>` : '';
  const fee = (c.status==='applied' && c.fee) ? `<div class="fee">당청 시 제세공과금 ${won(c.fee)}원</div>` : '';
  const prog = p ? `<div class="prog"><i style="width:${Math.round(p.done/p.total*100)}%"></i></div>` : '';
  const note = c.note ? `<div class="note">${esc(c.note)}</div>` : '';
  return `<article class="card" data-action="open" data-id="${c.id}">
    <div class="ct"><span class="plat">${esc(c.platform)}</span>
      <span class="st st-${c.status}">${stLabel(c.status)}</span>${dd}</div>
    <div class="nm">${esc(c.name)}</div>
    <div class="meta">${dateLine}${p?` · 체크 ${p.done}/${p.total}`:''}</div>
    ${fee}${prog}${note}
  </article>`;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ───────── views ───────── */
function render(){
  document.querySelectorAll('#nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.view === state.view));
  const v = document.getElementById('view');
  const titles = {home:'체험단 노트', list:'전체 목록', cal:'캘린더', money:'정산', set:'설정'};
  document.getElementById('hdrTitle').textContent = titles[state.view];
  document.getElementById('hdrCount').textContent =
    `진행 ${activeOnes().length} · 전체 ${DB.campaigns.length}`;
  document.getElementById('fab').style.display = (state.view==='home'||state.view==='list') ? '' : 'none';
  if(state.view === 'home') v.innerHTML = homeHTML();
  else if(state.view === 'list') v.innerHTML = listHTML();
  else if(state.view === 'cal') v.innerHTML = calHTML();
  else if(state.view === 'money') v.innerHTML = moneyHTML();
  else v.innerHTML = setHTML();
  if(state._lastView !== state.view){ window.scrollTo({top:0}); state._lastView = state.view; }
}

function refreshList(){
  const g = document.getElementById('listGrid'); if(!g) return;
  const items = filtered();
  g.innerHTML = items.length ? items.map(cardHTML).join('') : '<div class="empty">조건에 맞는 체험단이 없어요.</div>';
  const c = document.getElementById('listCount'); if(c) c.textContent = items.length + '건';
}

function homeHTML(){
  const nr = needsResult(), ds = dueSoon(3), ov = overdue(), te = todayEvents();
  const wc = activeOnes().length;
  const s = moneySums();
  const today = parseD(todayStr());
  const head = `${today.getMonth()+1}월 ${today.getDate()}일 ${'일월화수목금토'[today.getDay()]}요일`;

  let h = `<div class="stats">
    <div class="stat"><div class="k">진행 중</div><div class="v">${wc}<small>건</small></div><div class="d">발표 대기 ${DB.campaigns.filter(c=>c.status==='applied').length}건 포함</div></div>
    <div class="stat"><div class="k">마감 임박 (D-3)</div><div class="v">${ds.length}<small>건</small></div><div class="d">${ov.length? '지난 마감 '+ov.length+'건': '지난 마감 없음'}</div></div>
    <div class="stat acc"><div class="k">받을 돈 (예정)</div><div class="v">${won(s.cashExpected + s.pointExpected)}<small>원</small></div><div class="d">현금 ${won(s.cashExpected)} · 포인트 ${won(s.pointExpected)}</div></div>
    <div class="stat"><div class="k">제세공과금 (확정)</div><div class="v">${won(s.feeConfirmed)}<small>원</small></div><div class="d">예상 ${won(s.feeExpected)}원 더</div></div>
  </div>`;

  h += `<div class="sec"><div class="sec-h"><h2>${head} 할 일</h2><span class="sub">${te.length + nr.length + ds.length ? '아래부터 확인' : '오늘은 여유'}</span></div>`;

  if(te.length){
    h += te.map(c => `<article class="card" data-action="open" data-id="${c.id}">
      <div class="ct"><span class="plat">${esc(c.platform)}</span><span class="st st-won">오늘 방문</span>
      <span class="dday now">${clock(c.visitAt)||'오늘'}</span></div>
      <div class="nm">${esc(c.name)}</div>
      <div class="meta">${c.note ? esc(c.note).slice(0,80) : '방문 일정'}</div></article>`).join('');
  }
  if(nr.length){
    h += `<div class="sec-h" style="margin-top:14px"><h2>결과 확인 필요</h2><span class="sub">발표일이 지났어요</span></div>`;
    h += nr.map(c => cardHTML(c) + `<div style="display:flex;gap:6px;margin:-4px 0 2px 4px">
      <button class="chip" data-action="quick" data-id="${c.id}" data-st="won">선정됐어요</button>
      <button class="chip" data-action="quick" data-id="${c.id}" data-st="lost">미선정</button></div>`).join('');
  }
  if(ds.length){
    h += `<div class="sec-h" style="margin-top:14px"><h2>마감 임박</h2><span class="sub">3일 안에 끝내야 해요</span></div>`;
    h += ds.map(cardHTML).join('');
  }
  if(!te.length && !nr.length && !ds.length){
    h += `<div class="empty">오늘 바로 할 일은 없어요.<br>발표 대기 ${DB.campaigns.filter(c=>c.status==='applied').length}건의 결과를 기다리는 중이에요 🙌</div>`;
  }
  h += `</div>`;

  const wk = weekEvents();
  if(wk.length){
    h += `<div class="sec"><div class="sec-h"><h2>이번 주 일정</h2><span class="sub">${wk.length}건</span></div>
      ${wk.slice(0,6).map(cardHTML).join('')}
      ${wk.length>6?`<div class="hint" style="text-align:center;margin-top:6px">외 ${wk.length-6}건은 목록·캘린더에서 볼 수 있어요</div>`:''}</div>`;
  }

  const next = activeOnes().filter(c => c.status!=='applied' || c.announceAt)
    .sort((a,b)=> (a.endAt||'9999').localeCompare(b.endAt||'9999')).slice(0,4);
  if(next.length){
    h += `<div class="sec"><div class="sec-h"><h2>마감 빠른 순</h2>
      <span class="sub" data-action="view" data-view="list" style="cursor:pointer">전체 보기 →</span></div>
      ${next.map(cardHTML).join('')}</div>`;
  }
  return h;
}

function STATE_LABEL(k){
  if(k==='active') return '진행 중만';
  if(k==='all') return '전체 보기';
  return stLabel(k) || k;
}

function calHTML(){
  const m = state.calMonth;
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const days = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
  const marks = {};
  DB.campaigns.forEach(c => {
    const push = (k,t) => { if(!c[k]) return; const d = c[k].slice(0,10);
      (marks[d] = marks[d] || {}); marks[d][t] = 1; };
    push('announceAt','a'); push('endAt','e'); push('visitAt','v');
  });
  let cells = '';
  for(let i=0;i<first.getDay();i++) cells += '<button class="day blank"></button>';
  for(let d=1;d<=days;d++){
    const ds = `${m.getFullYear()}-${pad(m.getMonth()+1)}-${pad(d)}`;
    const mk = marks[ds] || {};
    const dt = parseD(ds);
    const cls = ['day'];
    if(ds === todayStr()) cls.push('today');
    if(ds === state.calDay) cls.push('sel');
    if(dt.getDay() === 0) cls.push('sun');
    cells += `<button class="${cls.join(' ')}" data-action="calday" data-d="${ds}">
      <span class="n">${d}</span>
      <span class="dots">${mk.a?'<i class="dot a"></i>':''}${mk.e?'<i class="dot e"></i>':''}${mk.v?'<i class="dot v"></i>':''}</span>
    </button>`;
  }
  const dayItems = DB.campaigns.filter(c => ['announceAt','endAt','visitAt'].some(k => (c[k]||'').slice(0,10) === state.calDay));
  return `<div class="cal">
    <div class="cal-h">
      <button data-action="calprev">‹</button>
      <b>${m.getFullYear()}년 ${m.getMonth()+1}월</b>
      <button data-action="calnext">›</button>
    </div>
    <div class="cal-dow"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="cal-grid">${cells}</div>
  </div>
  <div class="sec" style="margin-top:12px">
    <div class="sec-h"><h2>${mdw(state.calDay)}</h2><span class="sub">${dayItems.length}건</span></div>
    <div class="daylist">${dayItems.length ? dayItems.map(cardHTML).join('') : '<div class="empty">이 날은 일정이 없어요.</div>'}</div>
  </div>
  <div class="sec"><div class="sec-h"><h2>표시</h2><span class="sub">점 색깔</span></div>
    <div class="mrow" style="gap:16px;font-size:12px;color:var(--ink2);font-weight:600">
      <span style="display:flex;align-items:center;gap:6px"><i class="dot a"></i>발표일</span>
      <span style="display:flex;align-items:center;gap:6px"><i class="dot e"></i>리뷰 마감</span>
      <span style="display:flex;align-items:center;gap:6px"><i class="dot v"></i>방문</span>
    </div>
  </div>`;
}

  const fees = DB.campaigns.filter(c => c.fee);
  const goods = DB.campaigns.filter(c => c.price && ['won','writing','submitted','done'].includes(c.status));
  const row = (c, kind) => {
    const amt = kind==='fee' ? c.fee : (kind==='goods' ? c.price : ((c.reward&&c.reward.amount)||0));

    <div class="stat acc"><div class="k">현금 (예정)</div><div class="v">${won(s.cashExpected)}<small>원</small></div><div class="d">받으면 '받음' 체크</div></div>
    <div class="stat acc"><div class="k">포인트 (예정)</div><div class="v">${won(s.pointExpected)}<small>원</small></div><div class="d">네이버페이 등</div></div>
    <div class="stat"><div class="k">받은 제품가</div><div class="v">${won(s.goods)}<small>원</small></div><div class="d">정가 합계</div></div>
    <div class="stat"><div class="k">제세공과금</div><div class="v">${won(s.feeConfirmed)}<small>원</small></div><div class="d">확정 기준</div></div>
  </div>
  <div class="sec"><div class="sec-h"><h2>정산 현금</h2><span class="sub">${cash.length}건</span></div>
    ${cash.length? cash.map(c=>row(c,'cash')).join('') : '<div class="empty">현금 정산 건이 없어요.</div>'}</div>
  <div class="sec"><div class="sec-h"><h2>포인트</h2><span class="sub">${point.length}건</span></div>
    ${point.length? point.map(c=>row(c,'point')).join('') : '<div class="empty">포인트 정산 건이 없어요.</div>'}</div>
  <div class="sec"><div class="sec-h"><h2>받은 제품 (정가)</h2><span class="sub">${goods.length}건</span></div>
    ${goods.length? goods.map(c=>row(c,'goods')).join('') : '<div class="empty">제품 수령 건이 없어요.</div>'}</div>
  <div class="sec"><div class="sec-h"><h2>제세공과금 (내가 낼 돈)</h2><span class="sub">${fees.length}건 · 예상 ${won(s.feeExpected)}원 포함</span></div>
    ${fees.length? fees.map(c=>row(c,'fee')).join('') : '<div class="empty">제세공과금 건이 없어요.</div>'}</div>
  <details class="help"><summary>제세공과금은 왜 나가나요?</summary>
    <p>체험단으로 물건을 받으면 기타소득으로 잡혀 정가의 22%를 다음 달에 냅니다. 위 금액은 공지 기준 예상치이고, 실제 고지서가 오면 '설정'에서 직접 고칠 수 있어요.</p></details>`;
}

  const bytes = new Blob([JSON.stringify(DB)]).size;
  return `<div class="sec"><div class="sec-h"><h2>데이터</h2><span class="sub">${won(bytes)} B · ${DB.campaigns.length}건</span></div>
    <div class="mrow"><div class="nm">JSON 내보내기<small>백업·PC에서 편집용</small></div>
      <button class="btn" data-action="export">내보내기</button></div>
    <div class="mrow" style="margin-top:8px"><div class="nm">JSON 가져오기<small>내보낸 파일로 복원</small></div>
      <button class="btn" data-action="import">가져오기</button></div>
    <input type="file" id="file" accept="application/json,.json" style="display:none">
    <div class="mrow" style="margin-top:8px"><div class="nm">초기 데이터로 되돌리기<small>지금까지 고친 내용이 사라져요</small></div>
      <button class="btn danger" data-action="reset">되돌리기</button></div>
  </div>
  <div class="sec"><div class="sec-h"><h2>플랫폼 계정</h2><span class="sub">로그인 수단</span></div>
    ${DB.accounts.map(a=>`<div class="mrow"><div class="nm">${esc(a.platform)}<small>${esc(a.login)}${a.nick?' · '+esc(a.nick):''}</small></div>
      ${a.url&&a.url.startsWith('http')?`<a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener" style="text-decoration:none">열기</a>`:''}</div>`).join('')}
  </div>
  <div class="sec"><div class="sec-h"><h2>이 앱은</h2></div>
    <details class="help" open><summary>어떻게 저장되나요?</summary>
      <p>모든 내용은 이 브라우저의 localStorage에만 저장돼요. 서버로 보내지 않으니 다른 기기·브라우저에서는 보이지 않습니다. 기기를 바꾸기 전에는 'JSON 내보내기'로 백업해 주세요.</p></details>
    <details class="help"><summary>상태는 어떻게 바뀌나요?</summary>
      <p>발표 대기 → (발표일 지나면 홈에 '결과 확인 필요'로 올라옴) → 선정/미선정. 선정이면 작성 중 → 제출 완료 → 완료로 바꿔 주세요. 카드를 눌러 상태를 고를 수 있어요.</p></details>
  </div>`;
}

/* ───────── sheet ───────── */
function openSheet(){
  document.getElementById('scrim').classList.add('on');
  const s = document.getElementById('sheet');
  s.classList.add('on'); s.setAttribute('aria-hidden','false');
}
function closeSheet(){
  document.getElementById('scrim').classList.remove('on');
  const s = document.getElementById('sheet');
  s.classList.remove('on'); s.setAttribute('aria-hidden','true');
  state.editingId = null; state.buf = null;
}
function newItem(){
  return {id:'c-'+Date.now(), name:'', brand:'', platform:'브랜드커넥트', channel:['블로그'],
    status:'applied', appliedAt:todayStr(), announceAt:'', reviewStart:'', endAt:'', visitAt:'',
    price:null, fee:0, reward:{kind:'제품',amount:0}, tasks:[], url:'', note:'', paid:false};
}
function openDetail(id){
  const c = byId(id); if(!c) return;
  state.editingId = id;
  state.buf = JSON.parse(JSON.stringify(c));
  renderSheet();
  openSheet();
}
function openNew(){
  state.buf = newItem(); state.editingId = 'new';
  renderSheet(); openSheet();
}
function renderSheet(){
  const b = state.buf; if(!b) return;
  const isNew = state.editingId === 'new';
  const plats = Array.from(new Set([...DB.campaigns.map(c=>c.platform), '서울오빠','무신사','브랜드커넥트','파블로','카카오톡 선물','강남맛집','가보자체험단','카톡 수령','네이버쇼핑','원블','기타']));
  const chans = ['블로그','클립','인스타','무신사 후기','한달사용리뷰','방문','카톡 선물함'];
  const el = document.getElementById('sheet');
  el.innerHTML = `<div class="sh-top">
      <h3>${isNew?'체험단 추가':esc(b.name||'상세')}</h3>
      <button class="btn ghost" data-action="closeSheet" style="padding:6px 10px">닫기</button>
    </div>
    <div class="body">
      <div class="fld"><label>상품명</label><input data-f="name" value="${esc(b.name)}" placeholder="예: 쿤달 샴푸 세트"></div>
      <div class="fld two">
        <div><label>브랜드</label><input data-f="brand" value="${esc(b.brand||'')}"></div>
        <div><label>플랫폼</label>
          <select data-f="platform">${plats.map(p=>`<option ${b.platform===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="fld"><label>채널</label>
        <div class="chips">${chans.map(ch=>`<button class="chip ${(b.channel||[]).includes(ch)?'on':''}" data-action="chan" data-ch="${esc(ch)}">${esc(ch)}</button>`).join('')}</div>
      </div>
      <div class="fld"><label>상태</label>
        <select data-f="status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${b.status===k?'selected':''}>${v.label}</option>`).join('')}</select>
      </div>
      <div class="fld two">
        <div><label>신청일</label><input type="date" data-f="appliedAt" value="${b.appliedAt||''}"></div>
        <div><label>발표일</label><input type="date" data-f="announceAt" value="${b.announceAt||''}"></div>
      </div>
      <div class="fld two">
        <div><label>리뷰 시작</label><input type="date" data-f="reviewStart" value="${b.reviewStart||''}"></div>
        <div><label>리뷰 마감</label><input type="date" data-f="endAt" value="${b.endAt||''}"></div>
      </div>
      <div class="fld"><label>방문 일시 (맛집·체험형)</label><input type="datetime-local" data-f="visitAt" value="${(b.visitAt||'').slice(0,16)}"></div>
      <div class="fld two">
        <div><label>정가 (원)</label><input type="number" inputmode="numeric" data-f="price" value="${b.price==null?'':b.price}"></div>
        <div><label>제세공과금 (원)</label><input type="number" inputmode="numeric" data-f="fee" value="${b.fee==null?0:b.fee}"></div>
      </div>
      <div class="fld two">
        <div><label>정산 종류</label>
          <select data-f="reward.kind">${REWARD.map(r=>`<option ${(b.reward&&b.reward.kind)===r?'selected':''}>${r}</option>`).join('')}</select></div>
        <div><label>정산 금액 (원)</label><input type="number" inputmode="numeric" data-f="reward.amount" value="${(b.reward&&b.reward.amount)==null?0:b.reward.amount}"></div>
      </div>
      <div class="fld"><label>링크</label><input data-f="url" value="${esc(b.url||'')}" placeholder="캠페인 주소"></div>
      <div class="fld"><label>메모</label><textarea data-f="note" placeholder="담당자·계정·조건 등">${esc(b.note||'')}</textarea></div>
      <div class="fld"><label>필수 체크</label>
        <div id="tasks">${(b.tasks||[]).map((t,i)=>`<div class="tline ${t.done?'done':''}">
          <input type="checkbox" data-action="task" data-i="${i}" ${t.done?'checked':''}>
          <span>${esc(t.t)}</span>
          <button class="x" data-action="taskdel" data-i="${i}">✕</button></div>`).join('') || '<div class="hint">아직 체크 항목이 없어요.</div>'}
        </div>
        <div class="tadd"><input id="newtask" placeholder="예: 사진 10장"><button class="btn" data-action="taskadd">추가</button></div>
      </div>
    </div>
    <div class="foot">
      ${isNew?'':`<button class="btn danger" data-action="del" data-id="${b.id}">삭제</button>`}
      <button class="btn primary" data-action="save">저장</button>
    </div>`;
}

/* ───────── actions ───────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if(!el) return;
  const a = el.dataset.action;
  if(a === 'view'){ state.view = el.dataset.view; render(); }
  else if(a === 'open'){ openDetail(el.dataset.id); }
  else if(a === 'new'){ openNew(); }
  else if(a === 'closeSheet'){ closeSheet(); }
  else if(a === 'chip'){ state.chip = el.dataset.k; render(); }
  else if(a === 'calday'){ state.calDay = el.dataset.d; render(); }
  else if(a === 'calprev'){ state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()-1, 1);
    state.calDay = ymd(state.calMonth); render(); }
  else if(a === 'calnext'){ state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth()+1, 1);
    state.calDay = ymd(state.calMonth); render(); }
  else if(a === 'chan'){
    const ch = el.dataset.ch, arr = state.buf.channel || (state.buf.channel = []);
    const i = arr.indexOf(ch); i >= 0 ? arr.splice(i,1) : arr.push(ch);
    renderSheet();
  }
  else if(a === 'task'){
    const i = +el.dataset.i; state.buf.tasks[i].done = !state.buf.tasks[i].done;
    renderSheet();
  }
  else if(a === 'taskdel'){ state.buf.tasks.splice(+el.dataset.i,1); renderSheet(); }
  else if(a === 'taskadd'){
    const inp = document.getElementById('newtask'); const v = inp.value.trim();
    if(!v) return; (state.buf.tasks = state.buf.tasks||[]).push({t:v,done:false}); renderSheet();
  }
  else if(a === 'save'){
    const b = state.buf;
    if(!b.name.trim()){ toast('상품명을 넣어 주세요'); return; }
    b.price = b.price === '' ? null : Number(b.price) || null;
    b.fee = Number(b.fee) || 0;
    b.reward = b.reward || {kind:'제품', amount:0};
    b.reward.amount = Number(b.reward.amount) || 0;
    if(state.editingId === 'new'){
      DB.campaigns.unshift(b);
      toast('추가했어요');
    }else{
      const i = DB.campaigns.findIndex(c => c.id === b.id);
      if(i >= 0) DB.campaigns[i] = b; else DB.campaigns.unshift(b);
      toast('저장했어요');
    }
    saveDB(); closeSheet(); render();
  }
  else if(a === 'del'){
    if(!confirm('이 체험단을 지울까요? 되돌릴 수 없어요.')) return;
    DB.campaigns = DB.campaigns.filter(c => c.id !== el.dataset.id);
    saveDB(); closeSheet(); render(); toast('지웠어요');
  }
  else if(a === 'quick'){
    const c = byId(el.dataset.id); if(!c) return;
    c.status = el.dataset.st; saveDB(); render();
    toast(el.dataset.st === 'won' ? '선정으로 바꿨어요' : '미선정으로 정리했어요');
  }
  else if(a === 'paid'){
    const c = byId(el.dataset.id); if(!c) return;
    c.paid = !c.paid; saveDB(); render(); toast(c.paid?'받은 걸로 표시했어요':'대기로 되돌렸어요');
  }
  else if(a === 'export'){
    const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = `체험단노트_${todayStr()}.json`;
    link.click(); URL.revokeObjectURL(url); toast('내보냈어요');
  }
  else if(a === 'import'){ document.getElementById('file').click(); }
  else if(a === 'reset'){
    if(!confirm('처음 데이터로 되돌릴까요? 지금까지 고친 내용이 사라져요.')) return;
    DB = JSON.parse(JSON.stringify(SEED)); saveDB(); render(); toast('되돌렸어요');
  }
});

document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f;
  if(f && state.buf){
    if(f === 'reward.kind' || f === 'reward.amount'){
      state.buf.reward = state.buf.reward || {kind:'제품', amount:0};
      state.buf.reward[f.split('.')[1]] = e.target.value;
    }else{
      state.buf[f] = e.target.value;
    }
  }
  if(e.target.id === 'q'){ state.q = e.target.value; refreshList(); }
});
document.addEventListener('change', e => {
  const a = e.target.dataset && e.target.dataset.action;
  if(a === 'platform'){ state.platform = e.target.value; refreshList(); }
  if(a === 'sort'){ state.sort = e.target.value; refreshList(); }
  if(e.target.id === 'file'){
    const file = e.target.files[0]; if(!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const d = JSON.parse(fr.result);
        if(!d || !Array.isArray(d.campaigns)) throw new Error('형식이 달라요');
        if(!confirm(`${d.campaigns.length}건을 불러올까요? 지금 데이터는 사라져요.`)) return;
        DB = d; saveDB(); render(); toast('불러왔어요');
      }catch(err){ alert('파일을 읽지 못했어요: ' + err.message); }
    };
    fr.readAsText(file);
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeSheet();
  if(e.key === 'Enter' && e.target.id === 'newtask'){
    const v = e.target.value.trim(); if(!v) return;
    (state.buf.tasks = state.buf.tasks||[]).push({t:v,done:false}); renderSheet();
  }
});

render();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
