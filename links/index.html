<head>

<title>채이 | 백수 채이의 성장 일기</title>
<meta name="description" content="채이의 모든 채널을 한곳에 — 블로그 · 유튜브 · 인스타그램 · 쓰레드 · 네이버 클립">
<meta name="theme-color" content="#FBF2E3">

<link rel="apple-touch-icon" href="profile.jpg">
<meta property="og:title" content="채이 | 백수 채이의 성장 일기">

<style>
  :root{
    --cream:#FBF2E3;
    --cream-2:#F6E7D2;
    --card:#FFFDF8;
    --ink:#4A3B2F;
    --ink-soft:#8A7A6B;
    --line:rgba(160,130,100,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 60% at 50% -10%, #FFFBF3 0%, rgba(255,251,243,0) 60%),
      linear-gradient(180deg,#FDF7EC 0%, var(--cream) 42%, var(--cream-2) 100%);
    background-attachment:fixed;
    min-height:100vh;
    min-height:100dvh;
    padding:44px 20px 56px;
    display:flex;
    justify-content:center;
    line-height:1.5;
    word-break:keep-all;
  }
  .wrap{width:100%;max-width:430px}

  /* 프로필 */
  .profile{text-align:center}
  .avatar{
    width:112px;height:112px;border-radius:50%;
    display:block;margin:0 auto 18px;
    object-fit:cover;
    border:4px solid #FFFDF8;
    box-shadow:0 8px 22px rgba(150,115,70,.18), 0 0 0 1px var(--line);
  }
  h1{
    font-size:20px;font-weight:800;letter-spacing:-.02em;
    margin:0 0 6px;
  }
  .handle{
    font-size:13px;color:#9A8A7A;margin:0 0 18px;letter-spacing:.01em;
  }
  .bio{
    font-size:13.5px;line-height:1.95;color:#6E5E50;
    margin:0 auto 30px;max-width:330px;
  }
  .bio span{display:block}

  /* 링크 버튼 */
  .links{display:flex;flex-direction:column;gap:12px}
  .link{
    display:flex;align-items:center;gap:14px;
    padding:13px 16px 13px 13px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    text-decoration:none;color:inherit;
    box-shadow:0 3px 10px rgba(160,125,80,.07);
    transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .link:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(160,125,80,.14);background:#fff}
  .link:active{transform:translateY(0) scale(.985)}
  .ico{
    flex:0 0 42px;width:42px;height:42px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;
  }
  .ico svg{width:22px;height:22px;display:block}
  .txt{flex:1;min-width:0}
  .name{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;color:#453629;margin:0 0 3px}
  .sub{display:block;font-size:11.5px;color:#9A8A7A;margin:0;line-height:1.4}
  .arrow{flex:0 0 auto;color:#C9B8A4;font-size:16px;line-height:1;padding-right:2px}

  .ico-blog{background:#E8FAF0;color:#03C75A}
  .ico-yt{background:#FFEFEF;color:#FF3D3D}
  .ico-ig{background:#FFEEF4;color:#E1306C}
  .ico-th{background:#F1EFEC;color:#3A322C}
  .ico-clip{background:#EFFAE3;color:#4CAF2E}

  footer{
    margin-top:34px;text-align:center;
    font-size:11px;color:#A99884;letter-spacing:.02em;
  }

  @media (prefers-reduced-motion:reduce){
    .link{transition:none}
  }
</style>
</head>
