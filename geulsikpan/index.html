s": 461, "likes": 2, "replies": 8, "reposts": 0, "shares": 0, "tags": [], "url": "https://www.threads.com/@just_keep_go_ing/post/Df9LSmHEofS", "parent": null}, {"dt": "2026-11-20T00:16:23.000Z", "id": "Df8WNMkkqtJ", "media": "none", "topic": "알바", "txt": "just_keep_go_ing\n알바\n2일\n어제 예고했던 피크 타임 10분 영혼 탈곡기썰!\n​주문이 미친 듯이 밀려들던 저녁 피크 시간.\n닭다리살 메뉴가 2가지 있는데, 내가 정신이 없어서 A가 아닌 B를 조리해 보낸 실수를 했다. \n1\n/\n7\n1\n6", "body": "어제 예고했던 피크 타임 10분 영혼 탈곡기썰!\n​주문이 미친 듯이 밀려들던 저녁 피크 시간.\n닭다리살 메뉴가 2가지 있는데, 내가 정신이 없어서 A가 아닌 B를 조리해 보낸 실수를 했다.", "thread": {"part": 1, "total": 7, "parts": ["어제 예고했던 피크 타임 10분 영혼 탈곡기썰!\n​주문이 미친 듯이 밀려들던 저녁 피크 시간.\n닭다리살 메뉴가 2가지 있는데, 내가 정신이 없어서 A가 아닌 B를 조리해 보낸 실수를 했다.", "처음 전화가 왔을 땐 단순히 소스 착오인 줄 알았다.\n다른 메뉴처럼 소분된 소스가 아니라 업소용 대용량 소스를 덜어 쓰는 거라 당장 챙겨드리긴 어렵고, \"죄송합니다, 다음번에 오셔서 말씀해 주시면 서비스 꼭 챙겨드리겠습니다\"라고 정중히 말씀드렸다.", "그런데 갑자기 수화기 너머로 화를 내시는 거다.\n본인이 그 메뉴를 많이 먹어봤다면서. 순간 '왜 이렇게까지 화를 내시지? 혹시 환불이나 다른 보상을 원하시는 건가?' 싶어서 조심스럽게 여쭤봤다.\n\"혹시 원하시는 게 어떤 걸까요? 계좌이체로 환불을 해드릴까요, 아니면 다시 배달을 해드릴까요?\"", "첫 번째 통화 땐 다시 배달을 원하시는 눈치였는데, 이번엔 갑자기 \"무슨 다시 배달이냐!\"며 또다시 악을 쓰시는 거다.\n수화기 너머로 옆에 있는 분이 \"아, 그냥 먹자\"며 말리는 소리까지 다 들리는데, 전화를 잡으신 분은 기어코 계좌번호를 5번이나 확인하고 전화를 끊으셨다.", "주문은 계속 밀리지, 혼자 매장 보면서 멘탈은 나가지... 진짜 '내가 지금 여기서 뭐 하고 있지?'라는 현타가 세게 왔다.\n마음을 추스르고 계좌이체를 해드린 뒤, 입금 확인차 내가 다시 전화를 드렸다.", "그런데 전화를 받은 목소리가 너무 차분한 거다? 알고 보니 기가 막힌 반전이 있었다.\n처음 전화했던 건 주문자 본인이었고, 중간에 전화를 넘겨받아 악을 지르고 계좌번호를 5번씩 확인했던 건 옆에 있던 친구분이었던 것.", "내 실수에서 시작된 일이니 메뉴가 잘못 갔을 때 재배달이나 환불을 해드리는 건 당연히 맞다.\n하지만 본인이 시킨 것도 아니면서 대신 전화를 뺏어 들어 고함부터 지르는 사람 때문에 피크 타임 10분을 통째로 날리고 나니, 어제는 정말 진이 빠지는 하루였다.\n손님😭 일하는 사람은 화풀이 대상이 아닙니다. 정말 매번 통화 연결음에서 나오는 안내 멘트처럼, 일하는 사람도 누군가의 사랑하는 가족입니다"]}, "threadPart": null, "threadTotal": null, "kst": "2026-11-20 09:16", "date": "2026-11-20", "month": "2026-11", "views": 139, "likes": 1, "replies": 6, "reposts": 0, "shares": 0, "tags": [], "url": "https://www.threads.com/@just_keep_go_ing/post/Df8WNMkkqtJ", "parent": null}, {"dt": "2026-11-20T00:16:23.000Z", "id": "Df8WNMLEon8", "media": "none", "topic": "알바", "txt" /post/DXFmPSTEhNp", "parent": null}]};
const POSTS = DATA.posts;
const fmt = n => (n==null? '–' : n.toLocaleString('ko-KR'));
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WEEK = ['일','월','화','수','목','금','토'];
const wd = d => WEEK[new Date(d+'T00:00:00').getDay()];

const state = {q:'', month:'all', tag:'all', sort:'new'};
const visible = () => POSTS.filter(p => !p.parent);

/* header + summary */
document.getElementById('collected').textContent = '2026.11.22 기준';
const totals = {
  posts: visible().length,
  views: visible().reduce((s,p)=>s+(p.views||0),0),
  likes: visible().reduce((s,p)=>s+p.likes,0),
  replies: visible().reduce((s,p)=>s+p.replies,0)
};
document.getElementById('stats').innerHTML = `
  <div class="stat"><div class="k">📝 총 게시글</div><div class="v">${POSTS.length}<small>개</small></div></div>
  <div class="stat fol"><div class="k">👥 현재 팔로워</div><div class="v">${DATA.followers}<small>명</small></div></div>
  <div class="stat"><div class="k">👀 글 조회수 합계</div><div class="v">${Math.round(totals.views/1000)}<small>천회 (${fmt(totals.views)})</small></div></div>
  <div class="stat"><div class="k">❤️ 받은 좋아요</div><div class="v">${fmt(totals.likes)}<small>개</small></div></div>
`;

/* top3 */
const top3 = [...visible()].sort((a,b)=>(b.views||0)-(a.views||0)||b.likes-a.likes).slice(0,3);
document.getElementById('top3').innerHTML = top3.map((p,i)=>`
  <a class="tcard" href="${p.url}" target="_blank" rel="noopener noreferrer">
    <span class="rank r${i+1}">TOP ${i+1}</span>
    <div class="meta">${p.topic?`<span class="chip">${esc(p.topic)}</span>`:''}<span>${p.date}</span></div>
    <div class="body">${esc(p.body.split('\n')[0]).slice(0,120)}</div>
    <div class="meta"><span>👀 ${fmt(p.views)}</span><span>❤️ ${p.likes}</span><span>💬 ${p.replies}</span></div>
  </a>`).join('');

/* filters */
const months = [...new Set(visible().map(p=>p.month))].sort().reverse();
document.getElementById('months').innerHTML =
  `<button data-m="all" class="on">전체<span class="c">${visible().length}</span></button>` +
  months.map(m=>{
    const n = visible().filter(p=>p.month===m).length;
    return `<button data-m="${m}">${m.slice(0,4)}년 ${+m.slice(5)}월<span class="c">${n}</span></button>`;
  }).join('');

const tagCount = {};
visible().forEach(p=>{
  const set = new Set();
  if(p.topic) set.add(p.topic);
  p.tags.forEach(t=>set.add('#'+t));
  set.forEach(t=>tagCount[t]=(tagCount[t]||0)+1);
});
const tagsSorted = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]);
const TAG_LIMIT = 14;
document.getElementById('tags').innerHTML =
  `<button data-t="all" class="on">전체</button>` +
  tagsSorted.map(([t,n],i)=>`<button data-t="${esc(t)}" class="${i>=TAG_LIMIT?'tg-hide':''}">${esc(t)}<span class="c">${n}</span></button>`).join('') +
  (tagsSorted.length>TAG_LIMIT? `<button class="moretag" id="tagMore">＋ 태그 더 보기 (${tagsSorted.length-TAG_LIMIT})</button>`:'');

/* list */
function match(p){
  if(state.month!=='all' && p.month!==state.month) return false;
  if(state.tag!=='all'){
    const set = new Set([...(p.topic?[p.topic]:[]), ...p.tags.map(t=>'#'+t)]);
    if(!set.has(state.tag)) return false;
  }
  if(state.q){
    const q = state.q.toLowerCase();
    const hay = (p.body+' '+(p.topic||'')+' '+p.tags.join(' ')+' '+p.date).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function sortFn(a,b){
  switch(state.sort){
    case 'old': return a.dt < b.dt ? -1 : 1;
    case 'likes': return b.likes-a.likes || (b.views||0)-(a.views||0);
    case 'replies': return b.replies-a.replies || b.likes-a.likes;
    case 'views': return (b.views||0)-(a.views||0) || b.likes-a.likes;
    default: return a.dt < b.dt ? 1 : -1;
  }
}
function hl(text){
  const t = esc(text);
  if(!state.q) return t;
  const q = state.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return t.replace(new RegExp(q,'gi'), m=>`<mark>${m}</mark>`);
}
function render(){
  const rows = visible().filter(match).sort(sortFn);
  document.getElementById('count').innerHTML =
    `<b>${rows.length}</b>개 카드` + (POSTS.length>visible().length? ` · 이어 쓴 글 ${POSTS.length-visible().length}개는 묶어서 표시`:``) +
    (state.q?` · ‘${esc(state.q)}’ 검색`:``) +
    (state.month!=='all'?` · ${state.month.slice(0,4)}년 ${+state.month.slice(5)}월`:``) +
    (state.tag!=='all'?` · ${esc(state.tag)}`:``);
  const list = document.getElementById('list');
  if(!rows.length){
    list.innerHTML = `<div class="empty">조건에 맞는 글이 없어요. 검색어나 필터를 바꿔 보세요 🙂</div>`;
    return;
  }
  list.innerHTML = rows.map((p,i)=>{
    const long = p.body.length > 210 || p.body.split('\n').length > 7;
    const thread = p.thread;
    return `
    <article class="post" data-i="${i}">
      <div class="phead">
        <span class="pdate">${p.date} (${wd(p.date)})</span>
        ${p.topic?`<span class="ptopic">${esc(p.topic)}</span>`:''}
        ${thread?`<span class="ptopic" style="background:#E8EFE2;color:#4F6B45">🧵 ${thread.total}편 중 1편</span>`:''}
      </div>
      <div class="pbody">${hl(p.body)}</div>
      ${long?`<button class="more">더 보기 ▾</button>`:''}
      ${thread?`<button class="threadbtn">이어 쓴 글 ${thread.total-1}개 펼치기 ▾</button>
        <div class="parts">${thread.parts.slice(1).map((t,k)=>`<div class="part"><div class="n">${k+2}</div><div>${esc(t)}</div></div>`).join('')}</div>`:''}
      ${p.tags.length?`<div class="tags">${p.tags.map(t=>`<span class="t" data-tag="#${esc(t)}">#${esc(t)}</span>`).join('')}</div>`:''}
      <div class="metrics">
        <span>👀 <b>${fmt(p.views)}</b></span>
        <span>❤️ <b>${fmt(p.likes)}</b></span>
        <span>💬 <b>${fmt(p.replies)}</b></span>
        <span>🔁 <b>${fmt(p.reposts)}</b></span>
        ${p.shares>0?`<span>📤 <b>${fmt(p.shares)}</b></span>`:''}
        <a class="plink" href="${p.url}" target="_blank" rel="noopener noreferrer">원문 보기 ›</a>
      </div>
    </article>`;
  }).join('');
}

/* events */
const qEl = document.getElementById('q'), xEl = document.getElementById('qx');
let timer;
qEl.addEventListener('input', ()=>{
  state.q = qEl.value.trim();
  xEl.style.display = state.q? 'block':'none';
  clearTimeout(timer); timer = setTimeout(render, 120);
});
xEl.addEventListener('click', ()=>{ qEl.value=''; state.q=''; xEl.style.display='none'; render(); qEl.focus(); });
document.getElementById('sort').addEventListener('change', e=>{ state.sort = e.target.value; render(); });
document.getElementById('months').addEventListener('click', e=>{
  const b = e.target.closest('button[data-m]'); if(!b) return;
  state.month = b.dataset.m;
  [...document.querySelectorAll('#months button')].forEach(x=>x.classList.toggle('on', x===b));
  render();
});
document.getElementById('tags').addEventListener('click', e=>{
  const b = e.target.closest('button[data-t]'); if(!b) return;
  state.tag = state.tag === b.dataset.t ? 'all' : b.dataset.t;
  [...document.querySelectorAll('#tags button')].forEach(x=>x.classList.toggle('on', x.dataset.t === state.tag));
  render();
});
document.getElementById('tags').addEventListener('click', e=>{
  if(e.target.closest('#tagMore')){
    document.getElementById('tags').classList.add('expanded');
    document.getElementById('tagMore').remove();
  }
});
document.getElementById('list').addEventListener('click', e=>{
  const post = e.target.closest('.post');
  if(!post) return;
  if(e.target.closest('.more')){ post.classList.toggle('open'); e.target.textContent = post.classList.contains('open')? '접기 ▴':'더 보기 ▾'; return; }
  if(e.target.closest('.threadbtn')){
    post.classList.toggle('openThread');
    const n = post.querySelector('.threadbtn');
    const total = post.querySelectorAll('.part').length;
    n.textContent = post.classList.contains('openThread')? `이어 쓴 글 접기 ▴` : `이어 쓴 글 ${total}개 펼치기 ▾`;
    return;
  }
  const tg = e.target.closest('.t');
  if(tg){
    const t = tg.dataset.tag;
    state.tag = t;
    [...document.querySelectorAll('#tags button')].forEach(x=>x.classList.toggle('on', x.dataset.t === t));
    render();
    window.scrollTo({top: document.querySelector('.panel').offsetTop - 10, behavior:'smooth'});
  }
});
document.getElementById('footnote').textContent = `마지막 수집 ${DATA.collectedAt} · 총 ${POSTS.length}개 글(이어 쓴 글 포함)`;
render();
</script>
</body>
</html>
